name: liblzma
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/tukaani-project/xz/releases/download/v5.8.2/xz-5.8.2.tar.xz
        destination: xz.tar.xz
        sha256: "890966ec3f5d5cc151077879e157c0593500a522f413ac50ba26d22a9a145214"
        sha512: "9cb422456d51df4261c16bcd68b188d64b778f43c875188cb140372dab9793c873111f5608c3dfe3dffe5dd6da9ba7ba96d7154d3d4fae26cb1cc22b6b66910e"
    prepare:
      - |
        tar -xf xz.tar.xz --strip-components=1

        ./configure \
          --prefix=/usr \
          --disable-rpath \
          --disable-werror \
          --disable-doc \
          --disable-xz \
          --disable-xzdec \
          --disable-lzmadec \
          --disable-lzmainfo \
          --disable-lzma-links \
          --disable-scripts \
          --disable-static
    build:
      - |
        make -j $(nproc)
    install:
      - |
        make install DESTDIR=/rootfs
        # locale
        rm -r /rootfs/usr/share
    test:
      - |
        fhs-validator /rootfs
finalize:
  - from: /rootfs
    to: /
